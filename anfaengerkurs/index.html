<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anfängerkurs: World Wide Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F7F5F2;
      --ink:      #1A1A18;
      --accent:   #2563EB;
      --muted:    #6B6B67;
      --arrow:    #2563EB;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 3rem;
      max-width: 820px;
      width: 100%;
    }

    /* --- Photo --- */
    .photo-wrap {
      flex-shrink: 0;
      position: relative;
    }

    .photo-wrap img {
      width: 280px;
      height: 340px;
      object-fit: cover;
      object-position: center top;
      border-radius: 4px;
      display: block;
      filter: grayscale(8%);
    }

    /* subtle shadow frame */
    .photo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
      pointer-events: none;
    }

    /* --- Arrow + Text --- */
    .callout {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .arrow-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .arrow {
      color: var(--arrow);
      animation: bounce-x 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes bounce-x {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(-7px); }
    }

    .headline {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.55rem, 3.2vw, 2.1rem);
      line-height: 1.22;
      color: var(--ink);
      max-width: 340px;
    }

    .headline em {
      font-style: italic;
      color: var(--accent);
    }

    .cta {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0.75rem 1.6rem;
      border-radius: 3px;
      text-decoration: none;
      width: fit-content;
      transition: background 0.18s, transform 0.14s;
    }

    .cta:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .fine-print {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: -0.6rem;
    }

    /* --- Mobile --- */
    @media (max-width: 600px) {
      .stage {
        flex-direction: column;
        align-items: flex-start;
        gap: 2rem;
      }
      .photo-wrap img {
        width: 100%;
        height: auto;
        max-width: 320px;
      }
      .arrow {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">

    <div class="photo-wrap">
      <img src="simon-kreppel.1024x1024.jpg" alt="Simon Kreppel" />
    </div>

    <div class="callout">
      <div class="arrow-row">
        <!-- animated arrow pointing left toward photo -->
        <svg class="arrow" width="44" height="28" viewBox="0 0 44 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M43 14H3M3 14L14 4M3 14L14 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 class="headline">
        Interesse an einem Einführungskurs in<br/>
        <em>World Wide Web?</em><br/>
        Buch mich.
      </h1>

      <a class="cta" href="mailto:s_seppel@timocom.com">Jetzt anfragen →</a>

      <p class="fine-print">Grundkenntnisse wie „Was ist ein Browser?" sind von Vorteil, aber kein Muss.</p>
    </div>

  </div>
</body>
</html>
