<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hintergrund -->
  <rect width="128" height="128" rx="20" fill="#003057"/>

  <!-- Lupe (FreightLens = Durchblick) -->
  <circle cx="52" cy="52" r="28" fill="none" stroke="#00A89D" stroke-width="6"/>
  <line x1="72" y1="72" x2="100" y2="100" stroke="#00A89D" stroke-width="7" stroke-linecap="round"/>

  <!-- Ampel-Punkte in der Lupe -->
  <circle cx="42" cy="42" r="6" fill="#059669"/>  <!-- Grün: profitabel -->
  <circle cx="52" cy="42" r="6" fill="#D97706"/>  <!-- Gelb: grenzwertig -->
  <circle cx="62" cy="42" r="6" fill="#DC2626"/>  <!-- Rot: verlust -->

  <!-- Prozent-Zeichen -->
  <text x="52" y="68" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">%</text>
</svg>
